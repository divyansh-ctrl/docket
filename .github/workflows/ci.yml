name: CI

# Fast per-push checks. The desktop app now has platform-specific code paths
# for provider discovery, workspace validation, and PTY signals, so the suite
# runs on all three operating systems rather than only on Linux.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # node-pty has no Linux prebuild and is compiled during npm ci.
      #
      # Wrapped in timeouts and retries because this step hung twice in a row
      # on 2026-08-19, sixteen minutes each time, on a PR whose own code never
      # got to run. An apt mirror that stops responding does not fail -- it
      # waits -- and the job timeout above is the only thing that eventually
      # ends it, twenty-five minutes later, with a message naming the job
      # rather than the step or the cause.
      #
      # Each attempt is capped separately rather than the step as a whole. A
      # single step timeout would be spent entirely inside the first hung
      # attempt, so the retries would never run -- which is the case they exist
      # for. Transient mirror failures are the common kind and a second attempt
      # usually clears them.
      - name: Install Linux build toolchain
        if: runner.os == 'Linux'
        # A backstop under the job's twenty-five: three attempts, each capped,
        # plus backoff. Reached only when every attempt has failed.
        timeout-minutes: 13
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y \
                --no-install-recommends python3 make g++; then
              exit 0
            fi
            echo "::warning::Linux build toolchain attempt ${attempt} failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::The Linux build toolchain could not be installed after three attempts."
          echo "node-pty is compiled during npm ci and needs python3, make and g++."
          exit 1

      - run: npm ci
      - run: npm run validate
      - run: npm test
      # The headless gate, built and then actually run. A bundled entry point
      # can typecheck, lint, and build cleanly while doing nothing at all when
      # executed -- which is how a version of this shipped that exited 0 in
      # silence on a repository with a failing test. The unit suite imports
      # main() from source and cannot see that class of bug; only the artifact
      # can.
      - run: npm run smoke:cli
      - run: npm audit --omit=dev

  # The office's one check a machine cannot make. Every other guarantee about
  # the floor is a test; whether the room *looks* right is not, and the two
  # defects that shipped furthest -- figures whose only moving part was their
  # hands, and name tags drawn a line below the heads they named -- were
  # invisible to the whole suite and obvious to a person in one second. This
  # does not verify the walk happened. It makes skipping it a decision.
  office-walk:
    name: Office walk recorded
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against the base commit, which a shallow clone
          # does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node --experimental-strip-types apps/desktop/scripts/office-walk.ts "${{ github.event.pull_request.base.sha }}"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The site had no job at all: the worker that gates every product download
  # was covered by a suite that only ran when someone ran it by hand. It has no
  # package.json and no dependencies, so there is nothing to install.
  site:
    name: Site
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      # Exercises the download worker against stubbed storage: unknown names,
      # names that try to climb out of the bucket, and a missing token.
      - name: Test the download worker
        run: node --experimental-strip-types worker/index.test.mjs

      # The manifest is all that stands between a visitor and a 404, and it has
      # been wrong once already.
      - name: Check the download manifest
        run: node scripts/check-downloads.mjs
