name: Desktop release

# Produces the downloadable Docket artifacts for macOS, Linux, and
# Windows. Native packaging cannot be cross-compiled: node-pty has no Linux
# prebuild and must be built on Linux, and the Squirrel installer needs a
# Windows host, so each target builds on its own runner.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a draft GitHub release from this run"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/desktop

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures build in one job on the arm64 runner. The
          # separate macos-13 job sat queued indefinitely, and Forge builds
          # x64 here without a second runner: Electron ships an x64 binary and
          # node-pty has a darwin-x64 prebuild.
          - label: macOS
            os: macos-14
            arch: universal
            make: npm run make:mac
          - label: Linux x64
            os: ubuntu-22.04
            arch: x64
            make: npm run make:linux
          - label: Windows x64
            os: windows-2022
            arch: x64
            make: npm run make:win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # dpkg and fakeroot back maker-deb; rpm provides rpmbuild for maker-rpm.
      # node-pty publishes no Linux prebuild, so it is compiled here and needs
      # the standard build toolchain.
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm python3 make g++
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      # A hosted runner starts with an empty keychain, so the certificate has to
      # be imported before the build or signing has nothing to sign with. The
      # keychain is created per run and discarded with the runner.
      - name: Import signing certificate
        # The secrets context is not available in a step-level `if`, only in
        # `env`, so the presence check happens inside the script instead.
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "No signing certificate configured; the build will be unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Generated per run rather than stored: this password protects a
          # keychain that exists for the length of one job.
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "$keychain"

      - name: Build distributables
        run: ${{ matrix.make }}
        env:
          # Signing stays off unless a certificate was actually imported. Keying
          # this off the certificate rather than off the identity name matters:
          # the build now fails when signing is requested and cannot be
          # performed, so a flag set without a certificate would break the
          # release rather than quietly producing an unsigned one.
          DOCKET_SIGN_MAC_APP: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && '1' || '0' }}
          # Notarization additionally needs a certificate, since an unsigned app
          # cannot be notarized and the config now refuses that combination.
          DOCKET_NOTARIZE_MAC_APP: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' && '1' || '0' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Collect distributables
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Ship only installable outputs; skip Squirrel's build intermediates.
          find out/make -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) \
            ! -name '*.nupkg' -exec cp {} dist-artifacts/ \;
          ls -lh dist-artifacts

      - name: Checksums
        shell: bash
        run: |
          cd dist-artifacts
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS.txt; else shasum -a 256 * > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: docket-desktop-${{ runner.os }}-${{ matrix.arch }}
          path: apps/desktop/dist-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten and re-checksum
        working-directory: .
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'SHA256SUMS.txt' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          # Drafted rather than published: the macOS and Windows builds are
          # unsigned until signing credentials exist, and that needs to be
          # stated in the release notes before anyone downloads them.
          draft: true
          files: release/*
          generate_release_notes: true
