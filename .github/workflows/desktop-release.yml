name: Desktop release

# Produces the downloadable AOS Desktop artifacts for macOS, Linux, and
# Windows. Native packaging cannot be cross-compiled: node-pty has no Linux
# prebuild and must be built on Linux, and the Squirrel installer needs a
# Windows host, so each target builds on its own runner.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a draft GitHub release from this run"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/desktop

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures build in one job on the arm64 runner. The
          # separate macos-13 job sat queued indefinitely, and Forge builds
          # x64 here without a second runner: Electron ships an x64 binary and
          # node-pty has a darwin-x64 prebuild.
          - label: macOS
            os: macos-14
            arch: universal
            make: npm run make:mac
          - label: Linux x64
            os: ubuntu-22.04
            arch: x64
            make: npm run make:linux
          - label: Windows x64
            os: windows-2022
            arch: x64
            make: npm run make:win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # dpkg and fakeroot back maker-deb; rpm provides rpmbuild for maker-rpm.
      # node-pty publishes no Linux prebuild, so it is compiled here and needs
      # the standard build toolchain.
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm python3 make g++
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build distributables
        run: ${{ matrix.make }}
        env:
          # Signing and notarization stay off unless the repository provides
          # credentials; an unsigned build is still produced either way.
          AOS_SIGN_MAC_APP: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && '1' || '0' }}
          AOS_NOTARIZE_MAC_APP: ${{ secrets.APPLE_ID != '' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Collect distributables
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Ship only installable outputs; skip Squirrel's build intermediates.
          find out/make -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) \
            ! -name '*.nupkg' -exec cp {} dist-artifacts/ \;
          ls -lh dist-artifacts

      - name: Checksums
        shell: bash
        run: |
          cd dist-artifacts
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS.txt; else shasum -a 256 * > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aos-desktop-${{ runner.os }}-${{ matrix.arch }}
          path: apps/desktop/dist-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten and re-checksum
        working-directory: .
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'SHA256SUMS.txt' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          # Drafted rather than published: the macOS and Windows builds are
          # unsigned until signing credentials exist, and that needs to be
          # stated in the release notes before anyone downloads them.
          draft: true
          files: release/*
          generate_release_notes: true
